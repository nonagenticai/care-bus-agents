[package]
name = "carebus"
version = "0.1.0"
edition = "2024"
description = "Customer-care agents (rig) decoupled by Redis Streams buses"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
redis = { version = "1.7.1", features = ["tokio-comp", "streams", "aio", "connection-manager"] }
reqwest = { version = "=0.13.5", features = ["json", "form", "query"] }
rig-agent = "0.46.0"
rig-core = { version = "0.44.0", features = ["reqwest"] }
rig-reqwest = "0.44.0"
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
axum = "=0.8.9"
