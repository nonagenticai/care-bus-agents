[package]
name = "demo-backends"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fake CRM / order / carrier / payment systems for care-bus demos"
license.workspace = true
repository.workspace = true

[[bin]]
name = "demo-backends"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.9.5"
rand_chacha = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
