# CI for a PUBLIC repository — self-contained, GitHub-hosted runners.
#
# ⛔ Why this file replaces `.github/workflows/ci.yml` rather than extending it:
#   1. A public repo CANNOT consume a private reusable workflow (the estate's `gitops-production`
#      rust-service/ts-service archetypes): the run dies at startup with zero jobs, no error.
#   2. A public repo CANNOT use the ARC self-hosted pools: a fork PR can edit `runs-on`, so a
#      self-hosted runner open to a public repo is untrusted code inside the estate network, and
#      a job that asks for one sits QUEUED forever. GitHub-hosted runners are free and unlimited
#      on public repos.
#   3. Required status checks are repo-wide. A path-filtered job that does not run on a PR never
#      reports, and a required context that never reports blocks every merge — hence one file,
#      every job on every PR, no `paths:`.
#
# ⛔ Every job is gated on `!github.event.repository.private`. The org's Actions billing is in a
#    failed state, so a PRIVATE repo cannot start an ubuntu-latest job at all (it fails UNSTARTED:
#    steps [], startedAt == createdAt, no log). The gate lets this file land while the repo is
#    private (jobs report "skipped", never red) and activate with zero edits at the flip.
#
# Four images from one repo: ghcr.io/nonagenticai/care-bus-agents (Dockerfile.rust, PACKAGE=carebus),
# carebus-api (PACKAGE=carebus-api), demo-backends (PACKAGE=demo-backends) and carebus-web
# (web/Dockerfile). Publishing is OFF by default — set the repository variable PUBLISH_IMAGE=true.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Credentials first. A public repo is where a leak does the most damage.
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install betterleaks 1.10.1 (pinned, sha256-verified)
        run: |
          set -euo pipefail
          version=1.10.1
          sha=c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
          curl -fsSL -o "$RUNNER_TEMP/betterleaks.tgz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${version}/betterleaks_${version}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/betterleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tgz" -C "$RUNNER_TEMP" betterleaks
      - name: scan the tree
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/betterleaks" dir --redact --exit-code 1 --no-banner \
            --config=.betterleaks.toml \
            --gitleaks-ignore-path .betterleaksignore .

  # Private infrastructure must not be published. Run the same script locally before pushing.
  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: scan tracked files
        run: bash scripts/ci/no-private-refs.sh

  # The bus agents (carebus crate): a live Redis, no database.
  carebus:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Drops the DWARF, which is what makes target/ multi-gigabyte.
      CARGO_PROFILE_DEV_DEBUG: "0"
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v7

      - name: toolchain follows rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - uses: actions/cache@v6
        with:
          # Registry only: target/ is multi-gigabyte and would thrash the 10 GB cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: start Redis
        run: |
          set -euo pipefail
          docker run -d --name ci-redis \
            --tmpfs /data -p 127.0.0.1:6379:6379 \
            redis:8.10.1-alpine
          for _ in $(seq 1 60); do
            docker exec ci-redis redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-redis redis-cli ping

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p carebus --all-targets --locked -- -D warnings

      - name: cargo nextest (0.9.150 pinned, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz"
          echo "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  $RUNNER_TEMP/nextest.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$RUNNER_TEMP" cargo-nextest
          # --no-fail-fast: one red run reports every failure, not just the first one to trip.
          "$RUNNER_TEMP/cargo-nextest" nextest run -p carebus --no-fail-fast --no-tests=fail --color never --locked

      - name: cargo test --doc
        run: cargo test --doc --locked

      - name: cargo audit 0.22.2 (pinned, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/audit.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" audit

  # The API and researcher: a live Redis, and one Postgres 18 for the suite (each test still gets
  # its own fresh database inside it).
  carebus-api:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      REDIS_URL: redis://127.0.0.1:6379/
      TEST_REDIS_URL: redis://127.0.0.1:6379/
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: toolchain follows rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ⛔ Both storage choices below are load-bearing and they are different resources.
      #   --shm-size: Docker's default /dev/shm is 64 MB and Postgres parallel workers allocate
      #     dynamic shared memory there (53100 dsm_impl.c).
      #   NO --tmpfs for the data directory: a tmpfs is RAM-backed and capped at half the RAM,
      #     while every test that needs a fresh database creates one (53100 md.c).
      - name: start Postgres 18 and Redis
        run: |
          set -euo pipefail
          docker run -d --rm --name ci-pg \
            -e POSTGRES_PASSWORD=postgres \
            --shm-size=1g \
            -p 127.0.0.1:5432:5432 \
            postgres:18-alpine -c fsync=off -c max_connections=500
          docker run -d --name ci-redis \
            --tmpfs /data -p 127.0.0.1:6379:6379 \
            redis:8.10.1-alpine
          for _ in $(seq 1 60); do
            docker exec ci-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-pg pg_isready -h 127.0.0.1 -U postgres
          for _ in $(seq 1 60); do
            docker exec ci-redis redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-redis redis-cli ping

      - name: cargo clippy
        run: cargo clippy -p carebus-api --all-targets --locked -- -D warnings

      - name: cargo nextest (0.9.150 pinned, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz"
          echo "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  $RUNNER_TEMP/nextest.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$RUNNER_TEMP" cargo-nextest
          # --no-fail-fast: one red run reports every failure, not just the first one to trip.
          "$RUNNER_TEMP/cargo-nextest" nextest run -p carebus-api --no-fail-fast --no-tests=fail --color never --locked

  # The fake backends: Postgres 18 (one fresh database per test), no Redis.
  demo-backends:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: toolchain follows rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: start Postgres 18
        run: |
          set -euo pipefail
          docker run -d --rm --name ci-pg \
            -e POSTGRES_PASSWORD=postgres \
            --shm-size=1g \
            -p 127.0.0.1:5432:5432 \
            postgres:18-alpine -c fsync=off -c max_connections=500
          for _ in $(seq 1 60); do
            docker exec ci-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-pg pg_isready -h 127.0.0.1 -U postgres

      - name: cargo clippy
        run: cargo clippy -p demo-backends --all-targets --locked -- -D warnings

      - name: cargo nextest (0.9.150 pinned, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz"
          echo "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  $RUNNER_TEMP/nextest.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$RUNNER_TEMP" cargo-nextest
          # --no-fail-fast: one red run reports every failure, not just the first one to trip.
          "$RUNNER_TEMP/cargo-nextest" nextest run -p demo-backends --no-fail-fast --no-tests=fail --color never --locked

  web:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # There is no .nvmrc; web/package.json pins engines >=26.
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install (locked)
        run: npm ci --registry=https://registry.npmjs.org/

      - name: build
        run: npm run build

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      # The private archetype ran this; the kit's ts CI leaves it out, and dropping it would be a
      # silent quality regression.
      - name: svelte-check
        run: npm run ci:verify

      # Production dependencies only — dev-chain advisories are Dependabot's job.
      - name: audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/

  # Build (and on main, publish) the three Rust images. OFF by default: set PUBLISH_IMAGE=true.
  # On a PR this is a build+smoke check only; fork tokens are read-only.
  image-rust:
    if: ${{ !github.event.repository.private && vars.PUBLISH_IMAGE == 'true' }}
    needs: [carebus, carebus-api, demo-backends]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: carebus
            image: care-bus-agents
            smoke: 'for b in interaction orchestrator worker tool-executor tail; do test -x /usr/local/bin/$b || exit 1; done'
          - package: carebus-api
            image: carebus-api
            smoke: 'test -x /usr/local/bin/carebus-api && test -x /usr/local/bin/researcher'
          - package: demo-backends
            image: demo-backends
            smoke: 'test -x /usr/local/bin/demo-backends'
    env:
      # A variable, not a literal: a bare `name:tag` on a docker line reads as a Docker Hub ref.
      IMG: ${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: docker build --file Dockerfile.rust --build-arg PACKAGE=${{ matrix.package }} --tag "$IMG" .

      - name: smoke
        run: docker run --rm --entrypoint sh "$IMG" -c '${{ matrix.smoke }}'

      - name: push to ghcr.io (main only)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::7}"
          run="$(printf 'main-%06d' "${{ github.run_number }}")"
          for tag in "$sha" "$run" latest; do
            docker tag "$IMG" "$ref:$tag"
            docker push "$ref:$tag"
          done
          echo "pushed $ref:$sha $ref:$run $ref:latest"

  image-web:
    if: ${{ !github.event.repository.private && vars.PUBLISH_IMAGE == 'true' }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMG: carebus-web:ci
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: docker build --file web/Dockerfile --tag "$IMG" web

      - name: smoke (the server answers on PORT)
        run: |
          set -euo pipefail
          cid="$(docker run -d -e PORT=3000 -e ORIGIN=http://127.0.0.1:3000 -p 127.0.0.1:3000:3000 "$IMG")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "web did not answer 200 within 30s"
          docker logs "$cid" || true
          exit 1

      - name: push to ghcr.io (main only)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/carebus-web"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::7}"
          run="$(printf 'main-%06d' "${{ github.run_number }}")"
          for tag in "$sha" "$run" latest; do
            docker tag "$IMG" "$ref:$tag"
            docker push "$ref:$tag"
          done
          echo "pushed $ref:$sha $ref:$run $ref:latest"
