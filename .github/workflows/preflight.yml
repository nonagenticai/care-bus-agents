# Compile gate for lane branches — GitHub-hosted, no self-hosted runner, no local cargo.
#
# This is NOT a second CI and it writes no required status. It answers the one question the
# PR CI answers last (fmt + `cargo clippy --all-targets -D warnings`) in minutes on every push
# to a lane branch, so a lane learns it does not compile before paying for a coding-gate run.
# It is cancelled by its successor and never saves the rust-cache (save-if is main-only).
#
# The rust-cache shared-key matches the PR CI's (`carebus`), so this restores the dependency
# cache the last `main` run saved instead of paying a cold compile.
name: preflight

on:
  workflow_dispatch:
  push:
    branches: ['lane/**', 'issue/**', 'slice/**']

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: nonagenticai/ci-workflows/.github/workflows/rust-preflight.yml@d2ae87a417b00013838ba18841cdd1642b83fb89
    with:
      # Empty = the whole workspace: a break in a sibling crate is still a break.
      package: ""
      cache_shared_key: carebus
      # No sqlx compile-time macros in this workspace, so no database is needed to COMPILE.
      needs_postgres: false
      # Cold clippy of the full workspace; cancelled runs report pending, so keep headroom.
      timeout_minutes: 45
